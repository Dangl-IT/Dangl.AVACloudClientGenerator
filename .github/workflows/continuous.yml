name: continuous

on: [push]

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'

      - name: Run './build.cmd Test'
        run: ./build.cmd Test

  generate-clients-linux:
    name: generate-clients-linux
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'

      - name: Run './build.cmd GenerateClients' (Linux)
        run: ./build.cmd GenerateClients
        env:
          Configuration: Release

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeneratedClients
          path: output/*.zip

  publish-release:
    name: publish-release
    runs-on: windows-latest
    needs:
      - generate-clients-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'
          
      - name: Run './build.cmd PublishClientGenerator'
        run: ./build.cmd PublishClientGenerator
        env:
          Configuration: Release

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: GeneratedClients
          path: output

      - name: Run './build.cmd Publish'
        run: ./build.cmd Publish
        env:
          Configuration: Release
          GitHubAuthenticationToken: ${{ secrets.GITHUB_TOKEN }}
